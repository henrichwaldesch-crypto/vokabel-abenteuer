<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vokabel-Abenteuer">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Vokabel-Abenteuer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f6fb; color: #182033;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 28px 18px 50px; }
  h1 { margin: 0; font-size: 42px; }
  .subtitle { color:#718096; font-size:22px; margin: 8px 0 28px; }
  .card {
    background:white; border-radius:24px; padding:28px; margin:18px 0;
    box-shadow:0 5px 18px rgba(20,30,60,.07); text-align:center;
  }
  .topbar { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
  button {
    border:0; border-radius:15px; padding:14px 22px; font-size:20px;
    background:#e9eefc; color:#24457f; cursor:pointer;
  }
  button.primary { background:#3164e8; color:white; }
  button.good { background:#d9f8e4; color:#176b3b; }
  button.bad { background:#ffe1e1; color:#a52323; }
  button:active { transform:scale(.98); }
  .stat { background:#eef2ff; padding:12px 18px; border-radius:22px; font-size:20px; }
  .question { font-size:44px; font-weight:700; margin:25px 0 30px; }
  .direction { color:#718096; font-size:18px; }
  input {
    width:100%; padding:18px; border:3px solid #dce2ef; border-radius:15px;
    font-size:24px; outline:none;
  }
  input:focus { border-color:#3164e8; }
  .actions { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-top:16px; }
  .feedback { font-size:25px; font-weight:700; margin:22px 0 8px; }
  .answer { font-size:22px; margin:8px 0; }
  .pause { font-size:26px; font-weight:700; }
  .hidden { display:none; }
  .small { color:#718096; }
  @media (max-width:600px) {
    h1{font-size:32px}.subtitle{font-size:18px}.question{font-size:34px}
    .card{padding:20px}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 Vokabel-Abenteuer</h1>
  <div class="subtitle">Dein persönlicher Englisch-Trainer</div>

  <div class="card">
    <div class="topbar">
      <button onclick="showStart()">🏠 Start</button>
      <div class="stat">⭐ <span id="points">0</span></div>
      <div class="stat">🔥 <span id="streak">0</span></div>
      <div class="stat">❤️ <span id="hearts">❤️❤️❤️❤️❤️</span></div>
      <div class="stat">📝 <span id="count">0</span>/20</div>
    </div>
  </div>

  <div id="start" class="card">
    <div style="font-size:64px">🎮</div>
    <h2>Bereit zum Lernen?</h2>
    <p style="font-size:21px">Übe deine Vokabeln, sammle Punkte und schaffe eine lange 🔥 Streak!</p>
    <button class="primary" onclick="startGame()">▶️ Vokabeln lernen</button>
  </div>

  <div id="game" class="card hidden">
    <div class="direction" id="direction">Deutsch → Englisch</div>
    <div class="question" id="question">—</div>
    <input id="answer" autocomplete="off" autocapitalize="none" placeholder="Deine Antwort hier eingeben …">
    <div class="actions">
      <button class="primary" id="checkBtn" onclick="checkAnswer()">✅ Antwort prüfen</button>
      <button onclick="speakAnswer()">🔊 Anhören</button>
    </div>

    <div id="feedback"></div>
    <div id="nextArea" class="hidden">
      <button class="primary" onclick="nextQuestion()">➡️ Nächste Frage</button>
    </div>

    <div class="actions" style="margin-top:20px">
      <button onclick="nextQuestion()">🔄 Neue Frage</button>
      <button onclick="switchDirection()">↔️ Richtung wechseln</button>
    </div>
  </div>

  <div id="pause" class="card hidden">
    <div style="font-size:64px">☕</div>
    <div class="pause">Super! Du hast 20 Übungen geschafft.</div>
    <p style="font-size:20px">Zeit für eine kurze Pause. 🧠✨</p>
    <button class="primary" onclick="continueAfterPause()">▶️ Weiterlernen</button>
  </div>
</div>

<script>
const words = [
  ["gehen; fahren","go"],
  ["sein","be"],
  ["haben","have"],
  ["machen","do"],
  ["gut","good"],
  ["Haus","house"],
  ["Jahr","year"],
  ["Tag","day"],
  ["Freund","friend"],
  ["Wasser","water"],
  ["Essen","food"],
  ["Schule","school"],
  ["Buch","book"],
  ["Hund","dog"],
  ["Katze","cat"],
  ["groß","big"],
  ["klein","small"],
  ["schnell","fast"],
  ["langsam","slow"],
  ["neu","new"],
  ["alt","old"],
  ["schön","beautiful"],
  ["gehen","walk"],
  ["kommen","come"],
  ["sehen","see"],
  ["sprechen","speak"],
  ["lernen","learn"],
  ["spielen","play"],
  ["arbeiten","work"]
];

let points=0, streak=0, hearts=5, done=0, index=-1, direction=0, answered=false;

const $ = id => document.getElementById(id);
function updateStats(){
  $("points").textContent=points; $("streak").textContent=streak; $("count").textContent=done;
  $("hearts").textContent="❤️".repeat(hearts)+"🖤".repeat(5-hearts);
}
function showStart(){ $("start").classList.remove("hidden"); $("game").classList.add("hidden"); $("pause").classList.add("hidden"); }
function startGame(){
  $("start").classList.add("hidden"); $("pause").classList.add("hidden"); $("game").classList.remove("hidden");
  nextQuestion();
}
function nextQuestion(){
  if(done>0 && done % 20 === 0){
    $("game").classList.add("hidden"); $("pause").classList.remove("hidden"); return;
  }
  index=Math.floor(Math.random()*words.length); answered=false;
  $("question").textContent=words[index][direction];
  $("direction").textContent=direction===0 ? "Deutsch → Englisch" : "Englisch → Deutsch";
  $("answer").value=""; $("answer").disabled=false; $("checkBtn").disabled=false;
  $("feedback").innerHTML=""; $("nextArea").classList.add("hidden"); $("answer").focus();
}
function normalize(s){ return s.toLowerCase().trim().replace(/[.,!?;:]/g,"").replace(/\s+/g," "); }
function checkAnswer(){
  if(answered) return;
  const expected=words[index][1-direction], given=normalize($("answer").value);
  if(!given) return;
  answered=true; done++;
  const ok=given===normalize(expected) || (direction===0 && normalize(words[index][1]).split(";").map(normalize).includes(given));
  if(ok){
    points+=5; streak++; $("feedback").innerHTML='<div class="feedback" style="color:#176b3b">🎉 Gut gemacht! Richtig! +5 Punkte</div>';
  } else {
    streak=0; hearts=Math.max(0,hearts-1);
    $("feedback").innerHTML='<div class="feedback" style="color:#a52323">❌ Noch nicht richtig.</div><div class="answer">Richtige Antwort: <b>'+expected+'</b></div>';
  }
  updateStats(); $("answer").disabled=true; $("checkBtn").disabled=true; $("nextArea").classList.remove("hidden");
}
function switchDirection(){ direction=1-direction; nextQuestion(); }
function continueAfterPause(){ done=0; $("pause").classList.add("hidden"); $("game").classList.remove("hidden"); nextQuestion(); }
function speakAnswer(){
  const text=words[index][1];
  if("speechSynthesis" in window){ speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(text)); }
}
$("answer").addEventListener("keydown",e=>{ if(e.key==="Enter") checkAnswer(); });
updateStats();
</script>
</body>
</html>
